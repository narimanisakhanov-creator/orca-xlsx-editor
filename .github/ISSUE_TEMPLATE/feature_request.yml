name: Feature request
description: Suggest a capability or an improvement for XLSX Editor
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and where does the current editor get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should the editor do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other approaches you considered.
    validations:
      required: false
  - type: input
    id: orca-version
    attributes:
      label: Orca version
      description: From Orca's About window, for example 1.4.248.
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: XLSX Editor version
      description: From the plugin list, the release you installed, or orca-plugin.json.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: For example Windows 11 23H2, macOS 15.1 or Ubuntu 24.04.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Safe example workbook
      description: Optional. A minimal workbook that shows the workflow. Strip private data first; do not attach a real business file.
      placeholder: Drag the file here, or describe the workflow without a file.
    validations:
      required: false